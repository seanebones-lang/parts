# Production stack — image builds only (no source bind-mounts, no --reload).
#
# Required env (no weak defaults):
#   SECRET_KEY
#   POSTGRES_PASSWORD
#
# Example:
#   export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
#   export POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Optional: .env with the same keys (do not commit).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: parts_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealership_parts}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - parts_internal

  # Redis is internal-only (no host ports published).
  redis:
    image: redis:7-alpine
    container_name: parts_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - parts_internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: parts-backend:prod
    container_name: parts_backend_prod
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTH_MODE: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dealership_parts}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PGVECTOR_ENABLED: ${PGVECTOR_ENABLED:-false}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-auto}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No --reload; multi-worker ASGI for production
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "2",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - parts_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: parts-frontend:prod
    container_name: parts_frontend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    # Image already built; production server
    command: ["npm", "start"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - parts_internal

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  parts_internal:
    name: parts_internal
    driver: bridge
