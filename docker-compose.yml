# Dealership parts stack — compose profiles:
#   docker compose --profile core up          # postgres + redis only
#   docker compose --profile api up           # + backend
#   docker compose --profile full up          # + frontend + workers
#   docker compose --profile pgvector up      # alias for core (already pgvector image)
#   docker compose --profile obs up           # + flower

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dealership_postgres
    profiles: ["core", "api", "full", "pgvector", "default"]
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealership_parts}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dealership_redis
    profiles: ["core", "api", "full", "pgvector", "default"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealership_backend
    profiles: ["api", "full", "default"]
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-dealership_parts}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PGVECTOR_ENABLED=${PGVECTOR_ENABLED:-false}
      - VECTOR_BACKEND=${VECTOR_BACKEND:-auto}
      - AUTH_MODE=${AUTH_MODE:-demo}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./src:/src:ro
      - ./.parrts:/.parrts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/health || wget -q -O - http://127.0.0.1:8000/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealership_celery
    profiles: ["full"]
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-dealership_parts}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealership_celery_beat
    profiles: ["full"]
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-dealership_parts}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dealership_frontend
    profiles: ["full", "default"]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    command: npm run dev

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealership_flower
    profiles: ["obs", "full"]
    ports:
      - "5555:5555"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    command: celery -A app.celery flower --port=5555

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: dealership_network
