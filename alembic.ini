# Alembic config for Parts DMS (Postgres path)
# Run: parrts dms migrate   OR   alembic -c alembic.ini upgrade head

[alembic]
script_location = src/parrts/dms/migrations
prepend_sys_path = .
version_path_separator = os

# Overridden at runtime by env.py from DMS_DATABASE_URL / DATABASE_URL / POSTGRES_*
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
