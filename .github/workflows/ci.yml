name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (editable + dev)
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install pytest ruff || true
          else
            pip install pytest ruff
          fi

      - name: Ruff (optional)
        continue-on-error: true
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check src tests || true
          else
            echo "ruff not installed; skipping"
          fi

      - name: Pytest
        run: |
          if [ -d tests ]; then
            pytest -q --tb=short
          else
            echo "No tests/ directory; skipping pytest"
          fi

      - name: Retrieval eval smoke (optional)
        continue-on-error: true
        run: |
          if [ -f scripts/eval_retrieval.py ]; then
            python scripts/eval_retrieval.py || true
          fi
