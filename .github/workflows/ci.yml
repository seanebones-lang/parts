name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable + dev)
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install pytest ruff || true
          else
            pip install pytest ruff
          fi

      - name: Ruff (optional)
        continue-on-error: true
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check src tests || true
          else
            echo "ruff not installed; skipping"
          fi

      - name: Pytest
        run: |
          if [ -d tests ]; then
            pytest -q --tb=short
          else
            echo "No tests/ directory; skipping pytest"
          fi

      - name: Retrieval eval smoke
        continue-on-error: true
        run: |
          if [ -f scripts/eval_retrieval.py ]; then
            python scripts/eval_retrieval.py --dataset default -k 5
            python scripts/eval_retrieval.py --dataset extended -k 5 || true
          fi

  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        continue-on-error: true

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q || docker-compose -f docker-compose.yml config -q || true
          docker compose --profile core config -q || true
          docker compose --profile api config -q || true
