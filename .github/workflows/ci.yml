name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python core ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # [dev,api] so backend-importing unit tests (e.g. AgentResult/pydantic) collect
      - name: Install package (editable + dev + api)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest (core; full backend suite stays in backend-smoke)
        env:
          PYTHONPATH: backend:src
        run: pytest -q --tb=short -k "not backend_boot"

      - name: Retrieval eval smoke (default dataset)
        run: python scripts/eval_retrieval.py --dataset default -k 5

      - name: Retrieval eval extended (optional extra dataset)
        continue-on-error: true
        run: python scripts/eval_retrieval.py --dataset extended -k 5

  backend-smoke:
    name: Backend /api/v1 boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install parrts + backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
          pip install -r backend/requirements.txt
      - name: Pytest including backend boot
        env:
          PYTHONPATH: backend:src
        run: pytest -q --tb=short tests/test_backend_boot.py
      - name: verify_boot script
        env:
          PYTHONPATH: backend:src
        run: python scripts/verify_boot.py

  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        env:
          # Prod file requires these (no weak defaults); CI only validates config.
          SECRET_KEY: ci-compose-config-only-not-a-real-secret
          POSTGRES_PASSWORD: ci-compose-config-only-not-a-real-password
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          docker compose --profile core -f docker-compose.yml config -q
          docker compose --profile api -f docker-compose.yml config -q
