[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parrts"
version = "0.11.0"
description = "Modern hybrid RAG core for multi-location auto parts inventory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - NextEleven LLC" }
authors = [
    { name = "NextEleven LLC" },
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
postgres = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
embeddings = [
    "sentence-transformers>=3.0",
]
faiss = [
    "faiss-cpu>=1.8",
]
bm25 = [
    "rank-bm25>=0.2.2",
]
rerank = [
    "sentence-transformers>=3.0",
]
openai = [
    "openai>=1.40",
]
anthropic = [
    "anthropic>=0.34",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]
all = [
    "parrts[embeddings,faiss,bm25,rerank,openai,anthropic,api,dev,postgres]",
]

[project.scripts]
parrts = "parrts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parrts"]

[tool.hatch.build.targets.wheel.sources]
"src/parrts" = "parrts"

[tool.hatch.build.targets.sdist]
include = ["src/parrts", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "backend"]
markers = [
    "pgvector: live Postgres/pgvector e2e (skipped when DATABASE unreachable)",
    "postgres_dms: live Postgres DMS dual-mode (skipped when DMS_DATABASE_URL unreachable)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Tests often adjust sys.path before local imports.
"tests/**" = ["E402"]
# Streamlit UI inserts monorepo src onto sys.path before package imports.
"src/parrts/ui_streamlit.py" = ["E402"]
# Dense OEM template tables — readability over line length.
"src/parrts/dms/oem.py" = ["E501"]
